<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英语手写识别 - 智能手写识别</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff5c7">
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://unpkg.com/docx@8.2.2/build/index.umd.js"></script>
<style>
:root {
  --primary: #2563eb;
  --primary-soft: #dbeafe;
  --primary-glow: rgba(37, 99, 235, 0.22);
  --secondary: #f97316;
  --mint: #14b8a6;
  --sun: #facc15;
  --bg: #f3f8ff;
  --paper: #ffffff;
  --card: #ffffff;
  --text: #172033;
  --text-dim: #5d6b82;
  --border: #d9e5f5;
  --success: #16a34a;
  --error: #dc2626;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background:
    linear-gradient(180deg, rgba(219, 234, 254, 0.95) 0%, rgba(243, 248, 255, 0.9) 42%, #fff7ed 100%),
    repeating-linear-gradient(0deg, rgba(37, 99, 235, 0.05) 0 1px, transparent 1px 36px);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 40px;
}

.header {
  padding: 26px 20px 22px;
  text-align: center;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
}

.header::before {
  content: "A+";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: #fff;
  color: var(--secondary);
  border: 2px solid #fed7aa;
  box-shadow: 0 6px 0 #ffedd5;
  font-weight: 800;
  transform: rotate(-4deg);
}

.header h1 {
  font-size: 30px;
  font-weight: 800;
  color: var(--text);
}

.header p { font-size: 14px; color: var(--text-dim); margin-top: 6px; font-weight: 600; }

.container { max-width: 720px; margin: 0 auto; padding: 20px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 14px 34px rgba(37, 99, 235, 0.10);
  transition: transform 0.3s ease;
}

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.step {
  text-align: center;
  flex: 1;
  opacity: 0.7;
  transition: 0.3s;
  padding: 10px 6px;
  border-radius: 8px;
  background: #f8fbff;
  border: 1px solid #e8f0fb;
}
.step.active { opacity: 1; }
.step.done { color: var(--success); opacity: 1; }
.step-num { 
  width: 34px; height: 34px; border-radius: 8px; 
  background: #e8f0fb; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; margin-bottom: 6px;
}
.step.active { background: var(--primary-soft); border-color: #93c5fd; }
.step.active .step-num { background: var(--primary); color: white; box-shadow: 0 8px 18px var(--primary-glow); }
.step.done { background: #ecfdf5; border-color: #bbf7d0; }
.step.done .step-num { background: var(--success); color: white; }
.step-label { font-size: 12px; font-weight: 800; color: inherit; }

.upload-zone {
  border: 2px dashed #93c5fd;
  border-radius: var(--radius);
  padding: 42px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background:
    linear-gradient(135deg, #eff6ff 0%, #ffffff 48%, #fff7ed 100%);
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.upload-zone:hover { border-color: var(--secondary); background: #fff7ed; transform: translateY(-2px); }
.upload-icon { font-size: 54px; margin-bottom: 14px; display: block; }
.upload-text { font-size: 20px; font-weight: 800; color: #1d4ed8; }
.upload-hint { font-size: 14px; color: var(--text-dim); margin-top: 8px; font-weight: 600; }

.btn {
  padding: 15px 22px; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 800; cursor: pointer;
  transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px;
}
.btn-primary { 
  background: linear-gradient(135deg, var(--primary), var(--mint)); 
  color: white; width: 100%;
  box-shadow: 0 8px 0 #bfdbfe, 0 14px 24px rgba(37, 99, 235, 0.18);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #bfdbfe, 0 18px 26px rgba(37, 99, 235, 0.2); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-outline { background: #ffffff; color: #1d4ed8; border: 2px solid #bfdbfe; }
.btn-outline:hover { background: #eff6ff; border-color: #60a5fa; transform: translateY(-1px); }

.preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; margin-top: 20px; }
.preview-item { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; border: 2px solid #dbeafe; cursor: move; transition: transform 0.2s; background: #f8fbff; }
.preview-item.dragging { opacity: 0.4; transform: scale(0.9); }
.preview-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.remove-btn {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
  background: var(--error); color: white; border: 2px solid white; border-radius: 8px;
  cursor: pointer; font-size: 16px; font-weight: 800;
}

.input-group { margin-bottom: 20px; }
.input-label { display: block; font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.input-field {
  width: 100%; background: #f8fbff; border: 2px solid #dbeafe;
  border-radius: 8px; padding: 14px 16px; color: var(--text); font-size: 16px; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

.status-box {
  display: none; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 8px;
  margin-bottom: 20px; font-size: 15px; font-weight: 800;
}
.status-box.show { display: flex; }
.status-process { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.status-ok { background: #ecfdf5; color: #15803d; border: 1px solid #bbf7d0; }
.status-err,
.status-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

.progress-container { height: 10px; background: #dbeafe; border-radius: 8px; overflow: hidden; margin-bottom: 20px; display: none; }
.progress-bar { height: 100%; background: linear-gradient(to right, var(--primary), var(--mint), var(--sun)); width: 0; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

.edit-item {
  display: flex; align-items: center; gap: 12px; padding: 16px;
  background: #f8fbff; border: 1px solid #dbeafe;
  border-radius: 8px; margin-bottom: 10px; cursor: move;
}
.edit-item:hover { background: #eff6ff; border-color: var(--primary); }
.edit-item.dragging { opacity: 0.5; border: 2px dashed var(--primary); background: var(--primary-soft); }
.edit-index { font-size: 12px; font-weight: 800; color: white; width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.edit-text-group { flex: 1; }
.edit-en { font-weight: 800; font-size: 16px; color: var(--text); }
.edit-cn { font-size: 14px; color: var(--text-dim); font-weight: 600; }
.edit-del { color: var(--error); background: #fff; border: 1px solid #fecaca; border-radius: 8px; font-size: 20px; cursor: pointer; padding: 4px 10px; }

.result-item {
  padding: 16px; border-radius: 8px; background: #f8fbff;
  border-left: 5px solid var(--primary); margin-bottom: 12px;
}
.cat-header { font-size: 17px; font-weight: 800; color: #c2410c; margin: 24px 0 12px; border-bottom: 2px solid #fed7aa; padding-bottom: 8px; }

.download-help {
  display: none;
  margin-top: 14px;
  padding: 14px;
  border-radius: 8px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 14px;
  font-weight: 700;
}

.download-help.show { display: block; }

.manual-download-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 8px;
  background: #ffffff;
  border: 2px solid #fb923c;
  color: #c2410c;
  font-weight: 800;
  text-decoration: none;
}

.demo-note {
  margin-top: 14px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 700;
}

.history-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.history-title h3 { font-size: 18px; }

.history-list {
  display: grid;
  gap: 10px;
}

.history-empty {
  padding: 18px;
  border-radius: 8px;
  background: #f8fbff;
  border: 1px dashed #bfdbfe;
  color: var(--text-dim);
  font-weight: 700;
  text-align: center;
}

.history-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 8px;
  background: #f8fbff;
  border: 1px solid #dbeafe;
}

.history-name {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.history-meta {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 700;
  margin-top: 2px;
}

.history-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 2px solid #bfdbfe;
  color: #1d4ed8;
  background: #fff;
  font-weight: 800;
  text-decoration: none;
}

.spinner { width: 20px; height: 20px; border: 3px solid #bfdbfe; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 520px) {
  .header { padding: 20px 14px 18px; }
  .header h1 { font-size: 24px; }
  .container { padding: 14px; }
  .card { padding: 16px; }
  .steps { gap: 6px; }
  .step { padding: 8px 3px; }
  .step-num { width: 30px; height: 30px; }
  .step-label { font-size: 11px; }
  .upload-zone { min-height: 190px; padding: 28px 14px; }
  .upload-text { font-size: 18px; }
  .btn { font-size: 15px; padding: 13px 14px; }
  .history-item { grid-template-columns: 1fr; }
  .history-link { width: 100%; }
}

/* Warm workbook redesign */
:root {
  --primary: #f5a800;
  --primary-dark: #d98300;
  --primary-soft: #fff2b3;
  --primary-glow: rgba(245, 168, 0, 0.22);
  --secondary: #4d98ed;
  --mint: #57b894;
  --sun: #ffd34f;
  --bg: #fffaf0;
  --paper: #fffdf7;
  --card: #fffdf7;
  --text: #3f352c;
  --text-dim: #77695d;
  --border: #efd995;
  --success: #36946c;
  --error: #d85252;
  --radius: 22px;
}

body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(245, 168, 0, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245, 168, 0, 0.035) 1px, transparent 1px);
  background-size: 34px 34px;
  color: var(--text);
  padding-bottom: 56px;
}

.header {
  position: relative;
  padding: 34px 20px 28px;
  overflow: hidden;
  background: #fff5c7;
  border-bottom: 1px solid #f1d976;
  box-shadow: none;
}

.header::before {
  content: "";
  position: absolute;
  width: 170px;
  height: 170px;
  left: -90px;
  top: -94px;
  margin: 0;
  border: 28px solid rgba(255, 194, 38, 0.22);
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  transform: none;
}

.header::after {
  content: "";
  position: absolute;
  right: -46px;
  bottom: -64px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(77, 152, 237, 0.09);
}

.brand-mark {
  position: relative;
  z-index: 1;
  width: 48px;
  height: 48px;
  margin: 0 auto 10px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: #fff;
  background: var(--primary);
  box-shadow: 0 7px 0 #e6c14f;
  font-size: 24px;
}

.header h1 {
  position: relative;
  z-index: 1;
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
  font-size: clamp(30px, 7vw, 42px);
  line-height: 1.2;
  letter-spacing: 2px;
  color: #443526;
}

.header p {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 9px auto 0;
  color: #716052;
  font-size: 15px;
  font-weight: 700;
}

.container { max-width: 760px; padding: 22px 18px; }

.card {
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(223, 186, 73, 0.48);
  border-radius: var(--radius);
  background: rgba(255, 253, 247, 0.96);
  box-shadow: 0 12px 30px rgba(131, 94, 20, 0.07);
}

.steps-card { padding: 14px 18px; background: #fff7d7; }
.steps { gap: 0; }
.step {
  position: relative;
  padding: 8px 3px;
  border: 0;
  background: transparent;
  opacity: 0.62;
}
.step:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 25px;
  left: calc(50% + 24px);
  width: calc(100% - 48px);
  border-top: 2px dashed #e4c765;
}
.step-num {
  position: relative;
  z-index: 1;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fffdf7;
  color: #9c7b25;
  border: 2px solid #e6c650;
}
.step.active, .step.done { background: transparent; border: 0; opacity: 1; }
.step.active .step-num { background: var(--primary); border-color: var(--primary); box-shadow: 0 5px 12px var(--primary-glow); }
.step.done .step-num { background: var(--success); border-color: var(--success); }
.step-label { margin-top: 3px; font-size: 12px; color: #6f5a43; }

.section-kicker {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 18px;
  font-size: 21px;
  line-height: 1.3;
  color: #45362a;
}
.section-kicker i { color: var(--secondary); }

.input-group { margin-bottom: 18px; }
.input-label { margin-bottom: 9px; color: #554538; font-size: 15px; }
.input-field {
  min-height: 54px;
  padding: 14px 17px;
  border: 2px solid #efd36b;
  border-radius: 15px;
  background: #fffef9;
  color: var(--text);
}
.input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(245,168,0,.14); }

.upload-zone {
  min-height: 360px;
  padding: 18px 20px 24px;
  border: 2px dashed #dfb83d;
  border-radius: 24px;
  background: #fff9df;
  overflow: hidden;
}
.upload-zone:hover { border-color: var(--primary-dark); background: #fff5cc; transform: translateY(-2px); }
.upload-illustration {
  display: block;
  width: min(100%, 430px);
  max-height: 250px;
  margin: 0 auto 10px;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.upload-text { color: #55401c; font-size: 22px; }
.upload-hint { color: var(--text-dim); font-size: 14px; }

.btn {
  min-height: 54px;
  padding: 14px 20px;
  border-radius: 17px;
  font-size: 16px;
  box-shadow: none;
}
.btn i { font-size: 20px; }
.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 6px 0 #d88900;
}
.btn-primary:hover { background: #ffb511; transform: translateY(-2px); box-shadow: 0 8px 0 #d88900; }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0 #d88900; }
.btn-outline { background: #fffef9; color: #9d6600; border: 2px solid #e9bb3e; }
.btn-outline:hover { background: #fff6d0; border-color: var(--primary); }
.primary-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-top: 18px; }
.primary-actions .btn { width: 100%; }
.demo-button { width: 100%; margin-top: 16px; border-style: dashed; color: #397ec8; border-color: #9cc7f2; }
.demo-note { margin-top: 10px; color: #817365; font-weight: 600; }

.preview { border-top-color: #f0d77d !important; }
.preview-item { border-color: #efd36b; background: #fff9df; border-radius: 16px; }
.remove-btn { border-radius: 50%; }

.status-box { border-radius: 16px; }
.status-process { background: #fff6cf; color: #8a6100; border-color: #efd36b; }
.progress-container { background: #ffefb4; border-radius: 999px; }
.progress-bar { background: var(--primary); }
.spinner { border-color: #f5df91; border-top-color: var(--primary-dark); }

.history-card { background: transparent; border: 0; box-shadow: none; padding: 6px 2px; }
.history-title { padding: 0 4px; }
.history-title h3 { display: flex; align-items: center; gap: 9px; font-size: 20px; }
.history-title h3 i { color: var(--secondary); }
.history-item, .history-empty {
  border-color: #eed58a;
  border-radius: 17px;
  background: #fffdf7;
}
.history-link { border-color: #a8cbed; color: #397ec8; border-radius: 13px; }

.edit-item, .result-item { background: #fffaf0; border-color: #eed58a; border-radius: 16px; }
.edit-item:hover { background: #fff5d2; border-color: var(--primary); }
.edit-index { border-radius: 50%; background: var(--primary); }
.cat-header { color: #9d6600; border-bottom-color: #efd36b; }
.download-help { background: #fff7d7; border-color: #efd36b; color: #75500b; border-radius: 16px; }
.manual-download-link { border-color: var(--primary); color: #8b5c00; border-radius: 13px; }

@media (max-width: 520px) {
  .header { padding: 28px 16px 24px; }
  .header h1 { font-size: 32px; }
  .container { padding: 16px 14px; }
  .card { padding: 18px; border-radius: 20px; }
  .steps-card { padding: 10px 8px; }
  .step:not(:last-child)::after { left: calc(50% + 19px); width: calc(100% - 38px); }
  .step-num { width: 32px; height: 32px; }
  .upload-zone { min-height: 320px; padding: 14px 14px 22px; }
  .upload-illustration { max-height: 215px; }
  .upload-text { font-size: 20px; }
  .primary-actions { grid-template-columns: 1fr; }
  .primary-actions .btn:first-child { min-height: 62px; font-size: 18px; }
}
</style>
</head>
<body>
<div class="header">
  <div class="brand-mark" aria-hidden="true"><i class="bi bi-journal-richtext"></i></div>
  <h1>英语手写识别</h1>
  <p>拍下英语笔记，马上变成清楚的复习文档</p>
</div>

<div class="container">
  <div class="card steps-card">
    <div class="steps">
      <div class="step active" id="s1"><div class="step-num">1</div><div class="step-label">选照片</div></div>
      <div class="step" id="s2"><div class="step-num">2</div><div class="step-label">识别</div></div>
      <div class="step" id="s3"><div class="step-num">3</div><div class="step-label">检查</div></div>
      <div class="step" id="s4"><div class="step-num">4</div><div class="step-label">完成</div></div>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <h2 class="section-kicker"><i class="bi bi-pencil-fill"></i>今天整理哪一页？</h2>
    <div class="input-group">
      <label class="input-label" for="docTitle">笔记名称</label>
      <input type="text" id="docTitle" class="input-field" placeholder="例如：第五单元英语笔记" value="英语笔记整理">
    </div>
    <div class="upload-zone" id="uploadZone">
      <img class="upload-illustration" src="assets/english-notebook-camera.png" alt="手机正在拍摄一本英语笔记">
      <div class="upload-text">拍一张英语笔记</div>
      <div class="upload-hint">最多 5 张，照片越清楚，识别越准确</div>
    </div>
    <div class="primary-actions">
      <button class="btn btn-primary" onclick="$('cameraInput').click()"><i class="bi bi-camera-fill"></i>拍照识别</button>

<script>

const CAT_NAMES={1:"日常短语",2:"学术词汇",3:"商务用语",4:"习语表达",5:"完整句子",6:"其他"};

function formatEnglish(text){
  const words=text.trim().split(/\s+/);
  if(words.length<=3){
    return text.toLowerCase();
  }else{
    if(words.length>0){
      words[0]=words[0].charAt(0).toUpperCase()+words[0].slice(1).toLowerCase();
    }
    return words.join(' ');
  }
}


let currentResults=[];
let currentFiles=[];
const DEFAULT_WORKER_ENDPOINT = "https://cshj001-d7g5f1k0tc94d4181-1428383052.ap-shanghai.app.tcloudbase.com/english-ocr-api/api/ocr";
let workerEndpoint = localStorage.getItem('ocr_worker_endpoint');
if (!workerEndpoint || workerEndpoint.includes('workers.dev')) {
  workerEndpoint = DEFAULT_WORKER_ENDPOINT;
  localStorage.setItem('ocr_worker_endpoint', DEFAULT_WORKER_ENDPOINT);
}
let wakeLock = null;

const $=id=>document.getElementById(id);

// --- 移动端持久化逻辑 ---
function saveAppState() {
  const data = {
    results: currentResults,
    title: $('docTitle').value,
    time: Date.now()
  };
  localStorage.setItem('ocr_temp_state', JSON.stringify(data));
}

function clearAppState() {
  localStorage.removeItem('ocr_temp_state');
}

function tryRestoreState() {
  const saved = localStorage.getItem('ocr_temp_state');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    // 1小时内有效
    if (Date.now() - data.time < 3600000 && data.results && data.results.length > 0) {
      if (confirm(`发现 ${new Date(data.time).toLocaleTimeString()} 未保存的结果，是否恢复？`)) {
        currentResults = data.results;
        $('docTitle').value = data.title || '英语笔记整理';
        setStep(3);
        renderEditList();
        $('uploadCard').style.display='none';
        $('editBox').style.display='block';
        showStatus('ok', '已恢复上次数据');
        setTimeout(hideStatus, 2000);
      } else {
        clearAppState();
      }
    }
  } catch(e) { clearAppState(); }
}

// 振动反馈
function vibrate(pattern = 50) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// 屏幕常亮
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
  }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function setStep(n){for(let i=1;i<=4;i++){const s=$('s'+i);s.className='step'+(i<n?' done':i===n?' active':'')}}
function showStatus(type,msg){const b=$('statusBox');b.className='status-box show status-'+type;$('statusText').textContent=msg;$('statusSpinner').style.display=type==='process'?'block':'none'}
function hideStatus(){$('statusBox').className='status-box'}
function setProgress(p){$('progressBox').style.display=p>0?'block':'none';$('progressBar').style.width=p+'%'}

function getWorkerEndpoint(){
  const endpoint = (workerEndpoint || '').trim();
  if (endpoint) return endpoint;
  const input = prompt('请输入 Cloudflare Worker 接口地址。部署完成后只需设置一次。');
  if (!input || !input.trim()) return '';
  workerEndpoint = input.trim().replace(/\/$/, '');
  localStorage.setItem('ocr_worker_endpoint', workerEndpoint);
  return workerEndpoint;
}

function getWorkerOrigin(){
  try {
    const endpoint = getWorkerEndpoint();
    if (endpoint.includes('tcloudbase.com')) {
      return endpoint.replace('/api/ocr', '');
    }
    return new URL(endpoint).origin;
  } catch (error) {
    return DEFAULT_WORKER_ENDPOINT.replace('/api/ocr', '');
  }
}

function workerUrl(path){
  return getWorkerOrigin() + path;
}

$('uploadZone').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{if(e.target.files.length>0)handleFiles(Array.from(e.target.files))});
$('cameraInput').addEventListener('change',e=>{if(e.target.files.length>0)handleFiles(Array.from(e.target.files))});

function handleFiles(files){
  if(files.length>5){alert('最多只能选择5张图片');return}
  files.forEach(file=>{
    if(!file.type.startsWith('image/')){alert('请选择图片文件');return}
    if(file.size>15*1024*1024){alert('图片不能超过15MB');return}
  });
  
  if(currentFiles.length+files.length>5){
    alert('最多只能上传5张图片');
    files=files.slice(0,5-currentFiles.length);
  }
  
  currentFiles = [...currentFiles, ...files];
  renderPreview();
  
  $('preview').style.display='block';
  $('actionBtns').style.display='block';
}

function renderPreview() {
  const grid = $('previewGrid');
  grid.innerHTML = '';
  currentFiles.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement('div');
      div.className = 'preview-item';
      div.draggable = true;
      div.dataset.index = i;
      div.innerHTML = `<img src="${e.target.result}">
        <button class="remove-btn" onclick="removeFile(${i})">×</button>`;
      
      div.addEventListener('dragstart', handlePhotoDragStart);
      div.addEventListener('dragover', handlePhotoDragOver);
      div.addEventListener('drop', handlePhotoDrop);
      div.addEventListener('dragend', handlePhotoDragEnd);
      
      grid.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
  $('fileInfo').textContent = currentFiles.length + ' 张图片已准备就绪 (可拖拽排序)';
}

let draggedPhotoIndex = null;

function handlePhotoDragStart(e) {
  draggedPhotoIndex = parseInt(this.dataset.index);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handlePhotoDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handlePhotoDrop(e) {
  e.preventDefault();
  const targetIndex = parseInt(this.dataset.index);
  if (draggedPhotoIndex !== targetIndex) {
    const file = currentFiles.splice(draggedPhotoIndex, 1)[0];
    currentFiles.splice(targetIndex, 0, file);
    renderPreview();
  }
}

function handlePhotoDragEnd() {
  this.classList.remove('dragging');
}

function removeFile(index){
  currentFiles.splice(index,1);
  if(currentFiles.length===0) resetAll();
  else renderPreview();
}

function resetAll(){

  $('previewGrid').innerHTML='';

  $('resultsBox').style.display='none';

async function uploadDocumentToCloud(blob, fileName, title) {
  const response = await fetch(workerUrl('/api/documents'), {
    method: 'POST',
    headers: {
      'x-doc-title': encodeURIComponent(title),
      'x-doc-filename': encodeURIComponent(fileName)

    body: blob,
  });
  if (!response.ok) {
    const message = await response.text();
    throw new Error(message || '云端保存失败');

  const data = await response.json();
  return data.document;

function renderDocumentHistory(documents) {

function formatTime(value) {
  if (!value) return '刚刚';
  return new Date(value).toLocaleString('zh-CN', {
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  });
}

function formatSize(bytes) {
  if (!bytes) return '0 KB';
  if (bytes < 1024 * 1024) return Math.ceil(bytes / 1024) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

async function startProcess(){
  if(currentFiles.length===0)return;
  if(!getWorkerEndpoint()){alert('需要先配置 Cloudflare Worker 接口地址');return}

  $('startBtn').disabled=true;
  $('startBtn').innerHTML='<i class="bi bi-hourglass-split"></i>正在认真识别...';
  setStep(2);
  showStatus('process','正在进行图片预处理...');
  setProgress(5);
  await requestWakeLock();

  try{
    const total = currentFiles.length;
    let finishedCount = 0;
    const orderedResults = new Array(total).fill(null); // 按顺序存储每张图的结果

    const processFile = async (file, index) => {
      let attempts = 0;
      const maxAttempts = 2;
      
      const runWithRetry = async () => {
        try {
          const compressedImg = await compressImage(file, 800, 0.5);
          showStatus('process', `正在分析第 ${index + 1}/${total} 张图片...`);
          const items = await callDoubaoOCR(compressedImg);
          
          if (items && items.length > 0) {
            orderedResults[index] = items.map(item => {
              const en = formatEnglish(item.en || "");
              const cn = item.cn || '待翻译';
              const tag = typeof item.tag === 'number' && item.tag >= 1 && item.tag <= 6 ? item.tag : 6;
              const cat = CAT_NAMES[tag] || CAT_NAMES[6];
              return { english: en, chinese: cn, category: cat, tag: tag, confidence: 0.98 };
            });
          } else {
            orderedResults[index] = [];
          }
        } catch (e) {
          if (attempts < maxAttempts) {
            attempts++;
            await new Promise(r => setTimeout(r, 1000));
            return runWithRetry();
          }
          orderedResults[index] = []; // 彻底失败则给空数组
        }
      };

      await runWithRetry();
      finishedCount++;
      setProgress(10 + (finishedCount / total) * 80);
    };

    // 并发启动
    await Promise.all(currentFiles.map((file, i) => processFile(file, i)));

    // 汇总结果：严格按照 orderedResults 的顺序
    currentResults = orderedResults.flat().filter(Boolean);
    saveAppState();

    if(currentResults.length===0){
      showStatus('err','未能识别到有效文字，请重试');
      $('startBtn').disabled=false;
      return;
    }

    setProgress(100);
    vibrate([100, 50, 100]); // 处理完成振动
    showStatus('ok', `全部处理完成！共计 ${currentResults.length} 条内容`);
    
    setTimeout(() => {
      setStep(3);
      hideStatus();
      renderEditList();
      $('uploadCard').style.display='none';
      $('editBox').style.display='block';
      releaseWakeLock();
    }, 800);

  }catch(err){
    console.error(err);
    showStatus('err','处理失败: '+err.message);
    $('startBtn').disabled=false;
    $('startBtn').innerHTML='<i class="bi bi-arrow-clockwise"></i>重试识别';
    releaseWakeLock();
    vibrate(300); // 错误提醒
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function compressImage(file, maxWidth = 800, quality = 0.5) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        // 保持比例缩放
        if (width > maxWidth) {
          height = (maxWidth / width) * height;
          width = maxWidth;
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // 可以在此处添加简单的图像增强（如提高对比度），但对于现代大模型通常不必要
        ctx.drawImage(img, 0, 0, width, height);
        
        // 使用 JPEG 格式并降低质量以大幅减小体积
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

async function callDoubaoOCR(base64Image){
  const endpoint = getWorkerEndpoint();
  if(!endpoint) throw new Error('未配置 Cloudflare Worker 接口');

  const response = await fetch(endpoint,{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      image: base64Image
    })
  });

  if(!response.ok){
    const errText = await response.text();
    throw new Error(errText || 'Worker连接失败');
  }

  const data = await response.json();
  return data.results || [];
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function renderResults(){

  currentResults.forEach(r=>{if(!groups[r.tag])groups[r.tag]=[];groups[r.tag].push(r)});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderEditList(){

    `;
    
    div.addEventListener('dragstart',handleDragStart);
    div.addEventListener('dragover',handleDragOver);
    div.addEventListener('drop',handleDrop);
    div.addEventListener('dragend',handleDragEnd);
    
    box.appendChild(div);
  });
}

let draggedItem=null;

function handleDragStart(e){
  draggedItem=this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}

function handleDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
}

function handleDrop(e){
  e.preventDefault();
  if(this!==draggedItem){
    const fromIndex=parseInt(draggedItem.dataset.index);
    const toIndex=parseInt(this.dataset.index);
    const item=currentResults.splice(fromIndex,1)[0];
    currentResults.splice(toIndex,0,item);
    renderEditList();
  }
}

function handleDragEnd(){
  this.classList.remove('dragging');
}

function deleteEditItem(index){
  if(!confirm('确定删除这一条吗？')) return;
  currentResults.splice(index,1);
  saveAppState(); // 更新同步
  if(currentResults.length===0){
    resetAll();
  }else{
    renderEditList();
  }
}

}

async function downloadWord(){
  if(!currentResults.length)return;
  clearDownloadHelp();
  const customTitle = $('docTitle').value.trim() || '英语笔记整理';
  const fileName = `${customTitle}_${Date.now()}.docx`;

  showStatus('process','正在生成 Word 并保存到云端...');

  try{
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType, VerticalAlign } = docx;

    const children = [];

    // Title Section
    children.push(new Paragraph({
      alignment: AlignmentType.CENTER,
      spacing: { after: 400 },
      children: [
        new TextRun({ text: customTitle, bold: true, size: 36, font: "Microsoft YaHei", color: "1e1b4b" })
      ]
    }));

    // Data Table for Precise Alignment
    const isSentence = r => r && (r.tag === 5 || r.category === "完整句子" || r.category === CAT_NAMES[5]);
    const tableRows = [];

    currentResults.forEach((r, i) => {
      if (i > 0 && isSentence(r) && isSentence(currentResults[i - 1])) {
        // Add a blank row between sentences
        tableRows.push(new TableRow({
          children: [
            new TableCell({
              width: { size: 5, type: WidthType.PERCENTAGE },
              borders: { top: { style: BorderStyle.NONE }, bottom: { style: BorderStyle.NONE }, left: { style: BorderStyle.NONE }, right: { style: BorderStyle.NONE } },
              children: [new Paragraph({ children: [] })]
            }),
            new TableCell({
              width: { size: 40, type: WidthType.PERCENTAGE },
              borders: { top: { style: BorderStyle.NONE }, bottom: { style: BorderStyle.NONE }, left: { style: BorderStyle.NONE }, right: { style: BorderStyle.NONE } },
              children: [new Paragraph({ children: [] })]
            }),
            new TableCell({
              width: { size: 55, type: WidthType.PERCENTAGE },
              borders: { top: { style: BorderStyle.NONE }, bottom: { style: BorderStyle.NONE }, left: { style: BorderStyle.NONE }, right: { style: BorderStyle.NONE } },
              children: [new Paragraph({ children: [new TextRun({ text: "", size: 28 })] })]
            })
          ]
        }));
      }

      tableRows.push(new TableRow({
        children: [
          new TableCell({
            width: { size: 5, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: (i + 1).toString(), bold: true, size: 28 })] })]
          }),
          new TableCell({
            width: { size: 40, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: r.chinese, size: 28, font: "Microsoft YaHei" })] })]
          }),
          new TableCell({
            width: { size: 55, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: r.english, size: 28, font: "Arial" })] })]
          })
        ]
      }));
    });

    const table = new Table({
      width: { size: 100, type: WidthType.PERCENTAGE },
      borders: {
        top: { style: BorderStyle.NONE }, bottom: { style: BorderStyle.NONE },
        left: { style: BorderStyle.NONE }, right: { style: BorderStyle.NONE },
        insideHorizontal: { style: BorderStyle.SINGLE, size: 1, color: "E2E8F0" },
        insideVertical: { style: BorderStyle.NONE }
      },
      rows: tableRows
    });

    children.push(table);

    const doc = new Document({
      styles: { default: { document: { run: { font: "Arial", size: 28 } } } },
      sections: [{
        properties: { page: { margin: { top: 1440, right: 1000, bottom: 1440, left: 1000 } } },
        children: children
      }]
    });

    const blob = await Packer.toBlob(doc);
    const cloudDoc = await uploadDocumentToCloud(blob, fileName, customTitle);
    showCloudDownload(cloudDoc, blob, fileName);
    triggerNativeDownload(blob, fileName);
    await loadDocumentHistory();
    showStatus('ok', 'Word 已保存到云端，也已尝试下载到本机');
  } catch (err) {
    console.error(err);
    showStatus('err', '导出失败: ' + err.message);
  }
}

function copyResults(){
  if(!currentResults.length) return;
  const text = currentResults.map(r => `${r.english}\t${r.chinese}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showStatus('ok', '已复制到剪贴板！');
    setTimeout(hideStatus, 2000);
  }).catch(err => {
    alert('复制失败: ' + err);
  });
}

window.addEventListener('DOMContentLoaded',function(){
  tryRestoreState(); // 尝试恢复历史
  loadDocumentHistory();
});

window.addEventListener('beforeunload', (e) => {
  if ($('startBtn').disabled) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
