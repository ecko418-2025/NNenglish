<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pro English OCR - 智能手写识别</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://unpkg.com/docx@8.2.2/build/index.umd.js"></script>
<style>
:root {
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.5);
  --secondary: #a855f7;
  --bg: #0f172a;
  --card: rgba(30, 41, 59, 0.7);
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --border: rgba(255, 255, 255, 0.1);
  --success: #10b981;
  --error: #ef4444;
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 40px;
}

.header {
  padding: 40px 20px;
  text-align: center;
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(to right, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p { font-size: 14px; color: var(--text-dim); margin-top: 8px; }

.container { max-width: 600px; margin: 0 auto; padding: 20px; }

.card {
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  transition: transform 0.3s ease;
}

.steps { display: flex; justify-content: space-between; gap: 8px; }
.step { text-align: center; flex: 1; opacity: 0.5; transition: 0.3s; }
.step.active { opacity: 1; }
.step.done { color: var(--success); opacity: 1; }
.step-num { 
  width: 32px; height: 32px; border-radius: 50%; 
  background: var(--border); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; margin-bottom: 6px;
}
.step.active .step-num { background: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
.step.done .step-num { background: var(--success); }
.step-label { font-size: 12px; font-weight: 600; }

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.upload-zone:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
.upload-icon { font-size: 56px; margin-bottom: 16px; display: block; }
.upload-text { font-size: 18px; font-weight: 700; }
.upload-hint { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

.btn {
  padding: 14px 24px; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { 
  background: linear-gradient(135deg, var(--primary), var(--secondary)); 
  color: white; width: 100%;
  box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-outline { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

.preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 20px; }
.preview-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--border); }
.preview-item img { width: 100%; height: 100%; object-fit: cover; }
.remove-btn {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%;
  cursor: pointer; font-size: 14px; font-weight: bold;
}

.input-group { margin-bottom: 20px; }
.input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
.input-field {
  width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none;
  transition: border-color 0.3s;
}
.input-field:focus { border-color: var(--primary); }

.status-box {
  display: none; align-items: center; gap: 12px; padding: 16px; border-radius: 12px;
  margin-bottom: 20px; font-size: 14px; font-weight: 600;
}
.status-box.show { display: flex; }
.status-process { background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.2); }
.status-ok { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
.status-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

.progress-container { height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; }
.progress-bar { height: 100%; background: linear-gradient(to right, var(--primary), var(--secondary)); width: 0; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

.edit-item {
  display: flex; align-items: center; gap: 12px; padding: 16px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 10px; cursor: move;
}
.edit-item:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--primary); }
.edit-item.dragging { opacity: 0.5; border: 2px dashed var(--primary); background: rgba(99, 102, 241, 0.1); }
.edit-index { font-size: 12px; font-weight: 800; color: var(--primary); width: 24px; }
.edit-text-group { flex: 1; }
.edit-en { font-weight: 700; font-size: 14px; color: var(--text); }
.edit-cn { font-size: 13px; color: var(--text-dim); }
.edit-del { color: var(--error); background: transparent; border: none; font-size: 20px; cursor: pointer; padding: 4px; }

.result-item {
  padding: 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.02);
  border-left: 4px solid var(--primary); margin-bottom: 12px;
}
.cat-header { font-size: 16px; font-weight: 700; color: var(--secondary); margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

.spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

}
</style>
</head>
<body>
<div class="header">
  <h1>Pro English OCR</h1>
  <p>智能手写识别 · 自动翻译分类 · 极速 Word 导出</p>
</div>

<div class="container">
  <div class="card">
    <div class="steps">
      <div class="step active" id="s1"><div class="step-num">1</div><div class="step-label">选图</div></div>
      <div class="step" id="s2"><div class="step-num">2</div><div class="step-label">识别</div></div>
      <div class="step" id="s3"><div class="step-num">3</div><div class="step-label">编辑</div></div>
      <div class="step" id="s4"><div class="step-num">4</div><div class="step-label">完成</div></div>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <div class="input-group">
      <label class="input-label">文档标题 (用于 Word 文件名)</label>
      <input type="text" id="docTitle" class="input-field" placeholder="输入笔记标题，如：英语词组复习" value="英语笔记整理">
    </div>
    <div class="upload-zone" id="uploadZone">
      <span class="upload-icon">✨</span>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint">支持多选 (最多5张)，请确保光线充足</div>
    </div>
    <div class="btn-row" style="margin-top:20px; display: flex; gap: 12px;">
      <button class="btn btn-outline" style="flex:1" onclick="$('cameraInput').click()">📷 拍照</button>
      <button class="btn btn-outline" style="flex:1" onclick="$('fileInput').click()">📁 相册</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple max="5" style="display:none">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    
    <div class="preview" id="preview" style="display:none; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px;">
      <div id="previewGrid" class="preview-grid"></div>
      <div id="fileInfo" style="margin-top:12px; font-size:12px; color:var(--text-dim); text-align:center;"></div>
    </div>

    <div id="actionBtns" style="display:none; margin-top: 24px;">
      <button class="btn btn-primary" id="startBtn" onclick="startProcess()">🚀 开始智能识别</button>
      <button class="btn btn-outline" style="width:100%; margin-top:12px;" onclick="resetAll()">重选</button>
    </div>
  </div>

  <div class="status-box" id="statusBox"><div class="spinner" id="statusSpinner"></div><span id="statusText"></span></div>
  <div class="progress-container" id="progressBox"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card" id="editBox" style="display:none">
    <h3 style="margin-bottom:16px;">✏️ 识别结果调整</h3>
    <div id="editList" style="max-height:500px; overflow-y:auto; padding-right:4px;"></div>
    <div style="margin-top:24px; display: flex; flex-direction: column; gap: 12px;">
      <button class="btn btn-primary" onclick="confirmEdit()">✅ 确认并生成文档</button>
      <button class="btn btn-outline" onclick="resetAll()">放弃并重新开始</button>
    </div>
  </div>

  <div class="card results" id="resultsBox" style="display:none">
    <div id="resultsContent"></div>
    <div style="margin-top:24px; display: flex; flex-direction: column; gap: 12px;">
      <button class="btn btn-primary" onclick="downloadWord()">📥 重新下载 Word</button>
      <button class="btn btn-outline" onclick="copyResults()">📋 复制纯文本</button>
      <button class="btn btn-outline" onclick="resetAll()">✨ 继续处理新图</button>
    </div>
  </div>
</div>


<script>

const ACADEMIC=["hypothesis","methodology","empirical","theoretical","analysis","research",
"study","experiment","data","statistics","correlation","regression","variable","parameter",
"significant","conclusion","abstract","introduction","literature","discussion","reference",
"citation","academic","scholarly","journal","dissertation","thesis","qualitative","quantitative"];

const BUSINESS=["quarterly","annual","revenue","profit","loss","stakeholder","shareholder",
"investor","client","customer","market","strategy","meeting","deadline","budget","forecast",
"report","presentation","proposal","contract","negotiation","partnership","collaboration",
"roi","kpi","schedule","agenda","minutes","invoice","margin","dividend"];

const DAILY=["good morning","good afternoon","good evening","good night","hello","hi","hey",
"how are you","how do you do","nice to meet you","pleased to meet you","see you","goodbye",
"bye","take care","have a nice day","thank you","thanks","you're welcome","excuse me",
"i'm sorry","please","pardon me","how's it going","what's up","long time no see","take it easy"];

const CAT_NAMES={1:"日常短语",2:"学术词汇",3:"商务用语",4:"习语表达",5:"完整句子",6:"其他"};

function formatEnglish(text){
  const words=text.trim().split(/\s+/);
  if(words.length<=3){
    return text.toLowerCase();
  }else{
    if(words.length>0){
      words[0]=words[0].charAt(0).toUpperCase()+words[0].slice(1).toLowerCase();
    }
    return words.join(' ');
  }
}

function classify(text){
  const t=text.toLowerCase().trim();
  if(!t)return{cat:"其他",tag:6};
  for(const id of IDIOMS)if(t.includes(id))return{cat:"习语表达",tag:4};
  for(const w of ACADEMIC)if(t.includes(w))return{cat:"学术词汇",tag:2};
  for(const w of BUSINESS)if(t.includes(w))return{cat:"商务用语",tag:3};
  for(const p of DAILY)if(t.includes(p))return{cat:"日常短语",tag:1};
  const words=t.split(/\s+/);
  const starters=["i ","you ","he ","she ","it ","we ","they ","the ","a ","an ","this ","that ",
  "my ","your ","his ","her ","our ","their ","there ","here ","what ","how ","when ","where ",
  "why ","who ","which ","can ","could ","would ","should ","will ","shall ","may ","might ",
  "do ","does ","did ","have ","has ","had ","is ","are ","was ","were ","am ","be ","been "];
  const hasSubject=starters.some(s=>t.startsWith(s));
  const verbPattern=/\b(is|are|was|were|am|be|have|has|had|do|does|did|will|would|could|should|go|goes|went|get|gets|got|make|makes|made|take|takes|took|come|comes|came|see|sees|saw|know|knows|knew|think|thinks|thought|want|wants|wanted|need|needs|needed|like|likes|liked|love|loves|loved|work|works|worked|play|plays|played|read|reads|write|writes|wrote|learn|learns|learned|study|studies|studied|eat|eats|ate|drink|drinks|drank|sleep|sleeps|slept|run|runs|ran|walk|walks|walked|tell|tells|told|ask|asks|asked|give|gives|gave|find|finds|found|call|calls|called|try|tries|tried|help|helps|helped|show|shows|showed|move|moves|moved|live|lives|lived|believe|believes|believed|bring|brings|brought|happen|happens|happened|stand|stands|stood|lose|loses|lost|pay|pays|paid|meet|meets|met|include|includes|included|continue|continues|continued|set|sets|change|changes|changed|lead|leads|led|understand|understands|understood|follow|follows|followed|stop|stops|stopped|create|creates|created|speak|speaks|spoke|allow|allows|allowed|add|adds|added|spend|spends|spent|grow|grows|grew|open|opens|opened|win|wins|won|offer|offers|offered|remember|remembers|remembered|consider|considers|considered|appear|appears|appeared|buy|buys|bought|wait|waits|waited|send|sends|sent|expect|expects|expected|build|builds|built|stay|stays|stayed|fall|falls|fell|reach|reaches|reached|remain|remains|remained|suggest|suggests|suggested|raise|raises|raised|pass|passes|passed|sell|sells|sold|require|requires|required|decide|decides|decided|return|returns|returned|explain|explains|explained|carry|carries|carried|develop|develops|developed|provide|provides|provided|keep|keeps|kept|begin|begins|began|hear|hears|heard|leave|leaves|left|watch|watches|watched|receive|receives|received|agree|agrees|agreed|support|supports|supported|describe|describes|described|state|states|stated|drive|drives|drove|remove|removes|removed|hope|hopes|hoped|die|dies|died|start|starts|started|feel|feels|felt|become|becomes|became|leave|leaves|left|put|puts|put|keep|keeps|kept|let|lets|let|begin|begins|began|seem|seems|seemed|help|helps|helped|show|shows|showed|hear|hears|heard|play|plays|played|run|runs|ran|move|moves|moved|live|lives|lived|believe|believes|believed|hold|holds|held|bring|brings|brought|happen|happens|happened|write|writes|wrote|provide|provides|provided|sit|sits|sat|stand|stands|stood|lose|loses|lost|pay|pays|paid|meet|meets|met|include|includes|included|continue|continues|continued|set|sets|set|change|changes|changed|lead|leads|led|understand|understands|understood|watch|watches|watched|follow|follows|followed|stop|stops|stopped|create|creates|created|speak|speaks|spoke|read|reads|allowed|allow|allows|allowed|add|adds|added|spend|spends|spent|grow|grows|grew|open|opens|opened|walk|walks|walked|win|wins|won|offer|offers|offered|remember|remembers|remembered|consider|considers|considered|appear|appears|appeared|buy|buys|bought|wait|waits|waited|use|uses|used|find|finds|found|give|gives|gave|tell|tells|told|ask|asks|asked|try|tries|tried)/;
  if(hasSubject&&words.length>=3&&verbPattern.test(" "+t+" "))return{cat:"完整句子",tag:5};
  if(words.length>=4&&verbPattern.test(" "+t+" "))return{cat:"完整句子",tag:5};
  return{cat:"其他",tag:6};
}

let currentResults=[];
let currentFiles=[];
let apiKey="ark-4c7dd3e7-b3d9-4d11-bdbc-2457fa2c9c48-ab368";
let wakeLock = null;

const $=id=>document.getElementById(id);

// --- 移动端持久化逻辑 ---
function saveAppState() {
  const data = {
    results: currentResults,
    title: $('docTitle').value,
    time: Date.now()
  };
  localStorage.setItem('ocr_temp_state', JSON.stringify(data));
}

function clearAppState() {
  localStorage.removeItem('ocr_temp_state');
}

function tryRestoreState() {
  const saved = localStorage.getItem('ocr_temp_state');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    // 1小时内有效
    if (Date.now() - data.time < 3600000 && data.results && data.results.length > 0) {
      if (confirm(`发现 ${new Date(data.time).toLocaleTimeString()} 未保存的结果，是否恢复？`)) {
        currentResults = data.results;
        $('docTitle').value = data.title || '英语笔记整理';
        setStep(3);
        renderEditList();
        $('uploadCard').style.display='none';
        $('editBox').style.display='block';
        showStatus('ok', '已恢复上次数据');
        setTimeout(hideStatus, 2000);
      } else {
        clearAppState();
      }
    }
  } catch(e) { clearAppState(); }
}

// 振动反馈
function vibrate(pattern = 50) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// 屏幕常亮
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
  }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function setStep(n){for(let i=1;i<=4;i++){const s=$('s'+i);s.className='step'+(i<n?' done':i===n?' active':'')}}
function showStatus(type,msg){const b=$('statusBox');b.className='status show status-'+type;$('statusText').textContent=msg;$('statusSpinner').style.display=type==='process'?'block':'none'}
function hideStatus(){$('statusBox').className='status'}
function setProgress(p){$('progressBox').style.display=p>0?'block':'none';$('progressBar').style.width=p+'%'}

function saveApiKey(){
  const key=$('apiKeyInput').value.trim();
  if(!key){alert('请输入API Key');return}
  apiKey=key;
  localStorage.setItem('doubao_api_key',key);
  alert('API Key 已保存！');
}

function loadApiKey(){
  const saved=localStorage.getItem('doubao_api_key');
  if(saved){
    apiKey=saved;
    $('apiKeyInput').value=saved;
  }
}

$('uploadZone').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{if(e.target.files.length>0)handleFiles(Array.from(e.target.files))});
$('cameraInput').addEventListener('change',e=>{if(e.target.files.length>0)handleFiles(Array.from(e.target.files))});

function handleFiles(files){
  if(files.length>5){alert('最多只能选择5张图片');return}
  files.forEach(file=>{
    if(!file.type.startsWith('image/')){alert('请选择图片文件');return}
    if(file.size>15*1024*1024){alert('图片不能超过15MB');return}
  });
  
  if(currentFiles.length+files.length>5){
    alert('最多只能上传5张图片');
    files=files.slice(0,5-currentFiles.length);
  }
  
  files.forEach(file=>{
    currentFiles.push(file);
    const reader=new FileReader();
    reader.onload=e=>{
      const div=document.createElement('div');
      div.className='preview-item';
      div.innerHTML=`<img src="${e.target.result}">
        <button class="remove-btn" onclick="removeFile(${currentFiles.indexOf(file)})">×</button>`;
      $('previewGrid').appendChild(div);
    };
    reader.readAsDataURL(file);
  });
  
  $('fileInfo').textContent=currentFiles.length+' 张图片已准备就绪';
  $('preview').style.display='block';
  $('actionBtns').style.display='block';
}

function removeFile(index){
  currentFiles.splice(index,1);
  $('previewGrid').innerHTML='';
  currentFiles.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const div=document.createElement('div');
      div.className='preview-item';
      div.innerHTML=`<img src="${e.target.result}">
        <button class="remove-btn" onclick="removeFile(${i})">×</button>`;
      $('previewGrid').appendChild(div);
    };
    reader.readAsDataURL(file);
  });
  if(currentFiles.length===0)resetAll();
  else $('fileInfo').textContent=currentFiles.length+' 张图片已准备就绪';
}

function resetAll(){
  if(currentResults.length > 0 && !confirm('确定要清空当前所有内容并重新开始吗？')) return;
  currentFiles=[];
  currentResults=[];
  clearAppState();
  $('previewGrid').innerHTML='';
  $('preview').style.display='none';
  $('uploadCard').style.display='block';
  $('editBox').style.display='none';
  $('resultsBox').style.display='none';
  $('actionBtns').style.display='none';
  hideStatus();
  setProgress(0);
  setStep(1);
  $('startBtn').disabled=false;
  $('startBtn').textContent='🚀 开始智能识别';
  $('fileInput').value='';
  $('cameraInput').value='';
}

async function startProcess(){
  if(currentFiles.length===0)return;
  if(!apiKey){alert('请先设置并保存API Key');return}

  $('startBtn').disabled=true;
  $('startBtn').textContent='⚡ 正在加速处理...';
  setStep(2);
  showStatus('process','正在进行图片预处理...');
  setProgress(5);
  await requestWakeLock();

  try{
    currentResults = [];
    const total = currentFiles.length;
    let finishedCount = 0;

    const processFile = async (file, index) => {
      // 增加重试机制
      let attempts = 0;
      const maxAttempts = 2;
      
      const runWithRetry = async () => {
        try {
          const compressedImg = await compressImage(file, 1024, 0.7);
          showStatus('process', `正在分析第 ${index + 1}/${total} 张图片...`);
          const items = await callDoubaoOCR(compressedImg);
          
          if (items && items.length > 0) {
            items.forEach(item => {
              const en = formatEnglish(item.en || "");
              const cn = item.cn || '待翻译';
              const { cat, tag } = classify(en);
              currentResults.push({
                english: en, chinese: cn, category: cat, tag: tag, confidence: 0.98
              });
            });
            // 增量保存，防止中途断电或掉线
            saveAppState();
          }
        } catch (e) {
          if (attempts < maxAttempts) {
            attempts++;
            console.warn(`重试第 ${index+1} 张图片 (${attempts})`);
            await new Promise(r => setTimeout(r, 1000));
            return runWithRetry();
          }
          throw e;
        }
      };

      await runWithRetry();
      finishedCount++;
      setProgress(10 + (finishedCount / total) * 80);
    };

    await Promise.all(currentFiles.map((file, i) => processFile(file, i)));

    if(currentResults.length===0){
      showStatus('err','未能识别到有效文字，请重试');
      $('startBtn').disabled=false;
      return;
    }

    setProgress(100);
    vibrate([100, 50, 100]); // 处理完成振动
    showStatus('ok', `全部处理完成！共计 ${currentResults.length} 条内容`);
    
    setTimeout(() => {
      setStep(3);
      hideStatus();
      renderEditList();
      $('uploadCard').style.display='none';
      $('editBox').style.display='block';
      releaseWakeLock();
    }, 800);

  }catch(err){
    console.error(err);
    showStatus('err','处理失败: '+err.message);
    $('startBtn').disabled=false;
    $('startBtn').textContent='🔄 重试识别';
    releaseWakeLock();
    vibrate(300); // 错误提醒
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function compressImage(file, maxWidth = 1024, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        // 保持比例缩放
        if (width > maxWidth) {
          height = (maxWidth / width) * height;
          width = maxWidth;
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // 可以在此处添加简单的图像增强（如提高对比度），但对于现代大模型通常不必要
        ctx.drawImage(img, 0, 0, width, height);
        
        // 使用 JPEG 格式并降低质量以大幅减小体积
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

async function callDoubaoOCR(base64Image){
  const prompt = `Handwritten OCR Task:
Recognize all English text in the image and translate to Chinese.
Return ONLY a JSON object: {"results": [{"en": "...", "cn": "..."}]}`;

  const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+apiKey,
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      model:'doubao-seed-2-0-pro-260215',
      // response_format: { type: 'json_object' }, // 有时会导致不必要的延迟，靠 prompt 约束即可
      messages:[{
        role:'user',
        content:[
          {type:'image_url', image_url: {url: base64Image}},
          {type:'text', text:prompt}
        ]
      }]
    })
  });

  if(!response.ok){
    const errText = await response.text();
    throw new Error('API连接失败');
  }

  const data = await response.json();
  const rawContent = data.choices[0].message.content.trim();
  
  try {
    // 鲁棒性更强的 JSON 提取逻辑
    const jsonMatch = rawContent.match(/\{[\s\S]*\}/);
    const jsonStr = jsonMatch ? jsonMatch[0] : rawContent;
    const result = JSON.parse(jsonStr);
    return result.results || (Array.isArray(result) ? result : []);
  } catch (e) {
    console.error('OCR解析详情:', rawContent);
    throw new Error('识别数据处理异常');
  }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function renderResults(){
  const box=$('resultsContent');box.innerHTML='';
  const groups={};
  currentResults.forEach(r=>{if(!groups[r.tag])groups[r.tag]=[];groups[r.tag].push(r)});
  const order=[1,4,2,3,5,6];
  order.forEach(tag=>{
    if(!groups[tag])return;
    let html=`<div class="cat-header">[${tag}] ${CAT_NAMES[tag]}（${groups[tag].length}条）</div>`;
    groups[tag].forEach((r,i)=>{
      html+=`<div class="result-item">
        <div class="edit-en">${esc(r.english)}</div>
        <div class="edit-cn">${esc(r.chinese)}</div>
      </div>`;
    });
    box.innerHTML+=html;
  });
  $('resultsBox').style.display='block';
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderEditList(){
  const box=$('editList');
  box.innerHTML='';
  currentResults.forEach((r,i)=>{
    const div=document.createElement('div');
    div.className='edit-item';
    div.draggable=true;
    div.dataset.index=i;
    div.innerHTML=`
      <div class="edit-index">${(i+1).toString().padStart(2,'0')}</div>
      <div class="edit-text-group">
        <div class="edit-en">${esc(r.english)}</div>
        <div class="edit-cn">${esc(r.chinese)}</div>
      </div>
      <button class="edit-del" onclick="deleteEditItem(${i})">×</button>
    `;
    
    div.addEventListener('dragstart',handleDragStart);
    div.addEventListener('dragover',handleDragOver);
    div.addEventListener('drop',handleDrop);
    div.addEventListener('dragend',handleDragEnd);
    
    box.appendChild(div);
  });
}

let draggedItem=null;

function handleDragStart(e){
  draggedItem=this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}

function handleDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
}

function handleDrop(e){
  e.preventDefault();
  if(this!==draggedItem){
    const fromIndex=parseInt(draggedItem.dataset.index);
    const toIndex=parseInt(this.dataset.index);
    const item=currentResults.splice(fromIndex,1)[0];
    currentResults.splice(toIndex,0,item);
    renderEditList();
  }
}

function handleDragEnd(){
  this.classList.remove('dragging');
}

function deleteEditItem(index){
  if(!confirm('确定删除这一条吗？')) return;
  currentResults.splice(index,1);
  saveAppState(); // 更新同步
  if(currentResults.length===0){
    resetAll();
  }else{
    renderEditList();
  }
}

function confirmEdit(){
  $('editBox').style.display='none';
  $('resultsBox').style.display='block';
  setStep(4);
  renderResults();
  downloadWord();
}

async function downloadWord(){
  if(!currentResults.length)return;
  const customTitle = $('docTitle').value.trim() || '英语笔记整理';
  showStatus('process','正在导出精美 Word 文档...');

  try{
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType, VerticalAlign } = docx;

    const children = [];

    // Title Section
    children.push(new Paragraph({
      alignment: AlignmentType.CENTER,
      spacing: { after: 400 },
      children: [
        new TextRun({ text: customTitle, bold: true, size: 36, font: "Microsoft YaHei", color: "1e1b4b" })
      ]
    }));

    children.push(new Paragraph({
      alignment: AlignmentType.RIGHT,
      spacing: { after: 200 },
      children: [
        new TextRun({ text: "导出日期: " + new Date().toLocaleDateString('zh-CN'), size: 18, font: "Microsoft YaHei", color: "666666" })
      ]
    }));

    // Data Table for Precise Alignment
    const tableRows = currentResults.map((r, i) => {
      return new TableRow({
        children: [
          new TableCell({
            width: { size: 5, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: (i + 1).toString(), bold: true, size: 20 })] })]
          }),
          new TableCell({
            width: { size: 40, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: r.chinese, size: 20, font: "Microsoft YaHei" })] })]
          }),
          new TableCell({
            width: { size: 55, type: WidthType.PERCENTAGE },
            verticalAlign: VerticalAlign.CENTER,
            children: [new Paragraph({ children: [new TextRun({ text: r.english, size: 20, font: "Arial" })] })]
          })
        ]
      });
    });

    const table = new Table({
      width: { size: 100, type: WidthType.PERCENTAGE },
      borders: {
        top: { style: BorderStyle.NONE }, bottom: { style: BorderStyle.NONE },
        left: { style: BorderStyle.NONE }, right: { style: BorderStyle.NONE },
        insideHorizontal: { style: BorderStyle.SINGLE, size: 1, color: "E2E8F0" },
        insideVertical: { style: BorderStyle.NONE }
      },
      rows: tableRows
    });

    children.push(table);

    const doc = new Document({
      styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
      sections: [{
        properties: { page: { margin: { top: 1440, right: 1000, bottom: 1440, left: 1000 } } },
        children: children
      }]
    });

    const blob = await Packer.toBlob(doc);
    saveAs(blob, `${customTitle}_${Date.now()}.docx`);
    showStatus('ok', '文档导出成功！');
  } catch (err) {
    console.error(err);
    showStatus('err', '导出失败: ' + err.message);
  }
}

function copyResults(){
  if(!currentResults.length) return;
  const text = currentResults.map(r => `${r.english}\t${r.chinese}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showStatus('ok', '已复制到剪贴板！');
    setTimeout(hideStatus, 2000);
  }).catch(err => {
    alert('复制失败: ' + err);
  });
}
